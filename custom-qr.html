<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom QR Generator</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* CARD */
.card {
  background:white;
  width:420px;
  padding:30px;
  border-radius:24px;
  box-shadow:0 25px 60px rgba(0,0,0,0.25);
  text-align:center;
}

h2 { margin-bottom:20px; }

/* INPUTS */
input, select {
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid #ddd;
  margin-bottom:14px;
  font-size:14px;
}

/* Smooth color picker */
input[type="color"] {
  height:45px;
  cursor:pointer;
  transition:transform .25s ease;
}
input[type="color"]:hover {
  transform:scale(1.08);
}

/* Smooth dropdown */
select {
  cursor:pointer;
  transition:transform .25s ease;
}
select:hover {
  transform:scale(1.05);
}

/* File upload */
.file-label {
  display:block;
  padding:12px;
  border-radius:16px;
  background:#f3f4f6;
  cursor:pointer;
  margin-bottom:16px;
  transition:.25s;
}
.file-label:hover {
  transform:scale(1.07);
  box-shadow:0 8px 18px rgba(0,0,0,.15);
}
input[type="file"]{ display:none; }

/* Button */
button {
  width:100%;
  padding:14px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:.25s;
}
button:hover {
  transform:scale(1.08);
  box-shadow:0 12px 25px rgba(0,0,0,.3);
}

canvas {
  margin-top:20px;
  display:block;
  margin-left:auto;
  margin-right:auto;
}

.download {
  display:none;
  margin-top:12px;
  font-weight:600;
  text-decoration:none;
  color:#764ba2;
}
/* Secondary back button */
.secondary-btn {
  margin-top: 10px;
  background: #f3f4f6;
  color: #333;
}

.secondary-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

</style>
</head>

<body>

<div class="card">

<h2>Custom QR Designer</h2>

<!-- 1 TEXT -->
<input id="qrText" placeholder="Enter text or URL">

<!-- 2 BODY COLOR -->
<label>QR Body Color</label>
<input type="color" id="bodyColor" value="#000000">

<!-- 3 SIDE BOX COLOR -->
<label>Side Box Color</label>
<input type="color" id="cornerColor" value="#000000">

<!-- 4 SELECT CORNERS -->
<select id="cornerType">
  <option value="all">All corners</option>
  <option value="tr">Top Right</option>
  <option value="tl">Top Left</option>
  <option value="bl">Bottom Left</option>
</select>

<!-- 5 LOGO -->
<label for="logoInput" class="file-label">
  Insert Image (Optional)
</label>
<input type="file" id="logoInput" accept="image/*">

<button onclick="generate()">Generate QR</button>
<button class="secondary-btn" onclick="goBack()">⬅ Back</button>


<canvas id="canvas" width="320" height="320"></canvas>



</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function generate(){

  const text = qrText.value;
  if(!text) return alert("Enter text first");

  const bodyColor = bodyColorInput = document.getElementById("bodyColor").value;
  const cornerColor = document.getElementById("cornerColor").value;
  const type = document.getElementById("cornerType").value;

  const qr = qrcode(0,'H');
  qr.addData(text);
  qr.make();

  const count = qr.getModuleCount();
  const size = 300/count;

  ctx.clearRect(0,0,320,320);

  for(let r=0;r<count;r++){
    for(let c=0;c<count;c++){

      if(qr.isDark(r,c)){

        let color = bodyColor;

        const tl = (r<7 && c<7);
        const tr = (r<7 && c>count-8);
        const bl = (r>count-8 && c<7);

        if(type==="all" && (tl||tr||bl)) color=cornerColor;
        if(type==="tl" && tl) color=cornerColor;
        if(type==="tr" && tr) color=cornerColor;
        if(type==="bl" && bl) color=cornerColor;

        ctx.fillStyle=color;
        ctx.fillRect(c*size+10,r*size+10,size,size);
      }
    }
  }

  const file = document.getElementById("logoInput").files[0];
  if(file){
    const img=new Image();
    img.onload=function(){
      const s=80;
      ctx.drawImage(img,120,120,s,s);
    }
    img.src=URL.createObjectURL(file);
  }

  const link=document.getElementById("downloadLink");
  link.href=canvas.toDataURL();
  link.download="custom-qr.png";
  link.style.display="block";
}
function goBack() {
  window.location.href = "index.html";
}

</script>

</body>
</html>
