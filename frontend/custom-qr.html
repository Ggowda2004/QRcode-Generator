<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom QR Designer</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg,#6dd5ed,#2193b0);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

/* CARD */
.card {
  background:white;
  width:900px;
  padding:30px;
  border-radius:24px;
  box-shadow:0 25px 60px rgba(0,0,0,0.25);
}

/* HEADER */
h2 {
  text-align:center;
  margin-bottom:30px;
}

/* FLEX LAYOUT */
.layout {
  display:flex;
  gap:40px;
  justify-content:space-between;
  flex-wrap:wrap;
}

/* LEFT COLUMN: Inputs */
.left-col {
  display:flex;
  flex-direction:column;
  gap:15px;
  flex:1;
  min-width:300px;
}

input, select {
  padding:12px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:14px;
}

input[type="color"] {
  height:45px;
  cursor:pointer;
  transition:transform .25s ease;
}
input[type="color"]:hover { transform:scale(1.08); }

select {
  cursor:pointer;
  transition:transform .25s ease;
}
select:hover { transform:scale(1.05); }

.file-label {
  display:block;
  padding:12px;
  border-radius:16px;
  background:#f3f4f6;
  cursor:pointer;
  transition:.25s;
  text-align:center;
}
.file-label:hover {
  transform:scale(1.07);
  box-shadow:0 8px 18px rgba(0,0,0,.15);
}
input[type="file"]{ display:none; }

button {
  width:100%;
  padding:14px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,#0d3b66,#00aaff);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:.25s;
}
button:hover {
  transform:scale(1.08);
  box-shadow:0 12px 25px rgba(0,0,0,.3);
}
.secondary-btn {
  background:#f0f4f8;
  color:#0d3b66;
}
.secondary-btn:hover {
  transform:scale(1.08);
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* RIGHT COLUMN: QR Preview */
.qr-section {
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 20px 45px rgba(0,0,0,.18);
  flex:1;
  min-width:320px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
canvas { border-radius:12px; margin-bottom:15px; }
#downloadBtn {
  padding:10px 16px;
  border:none;
  border-radius:14px;
  background:#f0f4f8;
  color:#0d3b66;
  font-weight:600;
  cursor:pointer;
  transition:all .25s ease;
}
#downloadBtn:hover {
  transform:scale(1.05);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* RESPONSIVE */
@media(max-width:900px){
  .layout { flex-direction:column; align-items:center; }
  .qr-section { margin-top:20px; }
}
</style>
</head>
<body>

<div class="card">
  <h2>Custom QR Designer</h2>

  <div class="layout">
    <!-- LEFT: Inputs -->
    <div class="left-col">
      <input id="qrText" placeholder="Enter text or URL">

      <label>QR Body Color</label>
      <input type="color" id="bodyColor" value="#0d3b66">

      <label>Corner Color</label>
      <input type="color" id="cornerColor" value="#00aaff">

      <select id="cornerType">
        <option value="a">All corners</option>
        <option value="b">Top Left</option>
        <option value="c">Top Right</option>
        <option value="d">Bottom Left</option>
      </select>

      <label for="logoInput" class="file-label">Insert Image (Optional)</label>
      <input type="file" id="logoInput" accept="image/*">

      <button onclick="generate()">Generate QR</button>
      <button class="secondary-btn" onclick="goBack()">⬅ Back</button>
    </div>

    <!-- RIGHT: QR -->
    <div class="qr-section">
      <canvas id="canvas" width="320" height="320"></canvas>
      <button id="downloadBtn" onclick="downloadQR()">⬇ Download QR</button>
    </div>
  </div>

</div>
</body>
<script src="Script2.js"></script>
</html>
